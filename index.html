const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

const hasTTS='speechSynthesis' in window;let voice=null;
const pick=()=>{if(!hasTTS)return;const v=speechSynthesis.getVoices();voice=v.find(x=>/en[-_]GB/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null};
if(hasTTS){pick();speechSynthesis.onvoiceschanged=pick}
function say(t,slow){if(!hasTTS)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';if(voice)u.voice=voice;u.rate=slow?.5:.85;speechSynthesis.speak(u)}
// judging
function lev(a,b){if(Math.abs(a.length-b.length)>2)return 9;let p=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){const c=[i];for(let j=1;j<=b.length;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[b.length]}
const tol=n=>n<=4?0:n<=8?1:2;
function judge(o,a,strict){const x=sq(a),w=sq(o.w);if(!x)return null;if(x===w)return{ok:1,t:'word'};if(strict)return{ok:0,t:lev(x,w)<=1?'close':'no'};
 if(o.syn.has(x))return{ok:1,t:'syn'};if(lev(x,w)<=tol(w.length))return{ok:1,t:'typo'};
 for(const s of o.syn)if(lev(x,s)<=tol(s.length))return{ok:1,t:'syn'};return{ok:0,t:'no'}}
function record(o,ok){const s=S.st[o.k]||(S.st[o.k]=[0,0]);if(ok){s[0]++;sess.r++;sess.streak++;if(sess.streak>S.best)S.best=sess.streak;delete S.weak[o.k]}else{s[1]++;sess.w++;sess.streak=0;S.weak[o.k]=1}save()}
// views
const tabs=[['flash','Flashcards'],['quiz','Quiz'],['spell','Spelling'],['prog','Progress']];
function scopeBar(n){return '<div class="bar"><select id="sc" aria-label="Word set"><option value="all">All words</option><option value="weak">Weak words</option>'+themes.map(t=>'<option>'+esc(t)+'</option>').join('')+'</select><span class="mut">'+n+' to practise</span></div>'}
function setScope(){const s=$('#sc');if(s){s.value=S.scope}}
const empty='<div class="card"><b>Nothing in this set yet.</b><p class="mut">Pick another word set. Weak words fill up when you miss an answer or tap Still learning.</p></div>';
function vFlash(){const L=flashList();let h=scopeBar(L.length);if(!L.length)return h+empty;if(S.pos>=L.length||S.pos<0)S.pos=0;const e=L[S.pos];
 h+='<div class="card fc" tabindex="0" role="button" data-a="flip" aria-label="Flip card">';
 if(!flip)h+='<div class="no">No. '+e.n+' of '+D.length+(S.known[e.n]?' (known)':'')+'</div><div class="word">'+esc(e.w)+'</div><div class="mut">Tap the card to see the answer</div>';
 else h+='<div class="no">No. '+e.n+' <span class="tag">'+esc(e.t)+'</span></div><div class="word">'+esc(e.w)+'</div><div class="ipa">'+esc(e.i)+'</div><dl><dt>Meaning</dt><dd>'+esc(e.e)+'</dd><dt>In French</dt><dd>'+esc(e.f)+'</dd><dt>Synonyms</dt><dd>'+esc(e.s.join('; '))+'</dd></dl>';
 h+='</div><div class="row" style="margin-bottom:8px"><button data-a="prev">Previous</button>'+(hasTTS?'<button data-a="say" data-w="'+esc(e.w)+'">Listen</button>':'')+'<button data-a="fnext">Next</button></div>';
 h+='<div class="row"><button class="bd" data-a="learn">Still learning</button><button class="ok" data-a="got">Got it</button></div>';
 h+='<div class="bar" style="margin-top:14px"><label class="mut" for="jn">Go to No.</label><input id="jn" type="number" min="1" max="'+D.length+'" style="width:90px"><button data-a="jump">Go</button><span class="mut">Arrow keys and Space work too</span></div>';return h}
function newQ(){const P=poolList();if(!P.length){Q={empty:1};return}
 if(!queue.length)queue=shuffle(P);let o=queue.pop();if(Q&&Q.o&&o===Q.o&&queue.length)o=queue.pop();
 Q={o,def:o.defs[Math.random()*o.defs.length|0],done:0,res:null,hint:!hasTTS,dl:S.timed?Date.now()+20000:0,mode:S.mode};
 if(S.mode==='spell')setTimeout(()=>say(o.w),150)}
function stats(){const t=sess.r+sess.w;return '<div class="stats"><div><b>'+sess.r+'/'+t+'</b><span>Score</span></div><div><b>'+sess.streak+'</b><span>Streak (best '+S.best+')</span></div><div><b id="clk">0:00</b><span>Time</span></div><div><b>'+(t?Math.round(100*sess.r/t):0)+'%</b><span>Accuracy</span></div></div>'}
function answerCard(o){return '<div class="card"><div class="word">'+esc(o.w)+'</div><div class="ipa">'+esc(o.i)+'</div>'+(hasTTS?'<button data-a="say" data-w="'+esc(o.w)+'">Listen</button>':'')+'<dl><dt>Meaning</dt>'+o.defs.map(d=>'<dd>'+esc(d)+'</dd>').join('')+'<dt>In French</dt><dd>'+esc(o.fr.join(' / '))+'</dd><dt>Synonyms</dt><dd>'+esc(o.sl.join('; '))+'</dd></dl></div>'}
function vQuiz(){const sp=S.mode==='spell';if(!Q||Q.mode!==S.mode)newQ();let h=scopeBar(poolList().length)+stats();if(Q.empty)return h+empty;
 h+='<div class="bar">'+(sp?'':'<label class="chk"><input type="checkbox" id="strict"'+(S.strict?' checked':'')+'>Strict: the word only, exact spelling</label>')+'<label class="chk"><input type="checkbox" id="timed"'+(S.timed?' checked':'')+'>Timed (20 s)</label></div>';
 if(S.timed&&Q.dl)h+='<div class="tb"><i id="tbi"></i></div>';
 if(sp){h+='<div class="card"><div class="clue">Listen, then spell the word.</div><div class="row" style="margin-top:10px">'+(hasTTS?'<button data-a="say" data-w="'+esc(Q.o.w)+'">Play</button><button data-a="slow" data-w="'+esc(Q.o.w)+'">Play slowly</button>':'<span class="mut">Audio is not available on this device. Use the definition.</span>')+(Q.hint?'':'<button data-a="hint">Show definition</button>')+'</div>'+(Q.hint?'<p class="mut" style="margin-bottom:0">'+esc(Q.def)+'</p>':'')+'</div>'}
 else h+='<div class="card"><div class="mut">Which word, or synonym, matches this?</div><p class="clue" style="margin-bottom:0">'+esc(Q.def)+'</p></div>';
 if(!Q.done)h+='<input id="ans" class="ans" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type your answer" aria-label="Your answer"><div class="row"><button class="pri" data-a="check">Check</button><button data-a="skip">Skip</button></div>';
 else{const r=Q.res,t=r.t;h+='<div class="res '+(r.ok?'ok':'bd')+'">'+(r.ok?(t==='word'?'Correct.':t==='typo'?'Correct, with a small typo. The spelling is '+esc(Q.o.w)+'.':'Correct. That is a synonym. The word is '+esc(Q.o.w)+'.'):(t==='time'?'Time is up.':t==='skip'?'Skipped.':t==='close'?'Close, but the spelling is not exact.':'Incorrect.')+' '+(r.ok?'':'The answer is '+esc(Q.o.w)+'.'))+'</div>'+answerCard(Q.o)+'<button class="pri" style="width:100%" data-a="nextq">Next word</button>'}
 return h}
function vProg(){let att=0,cor=0;Object.values(S.st).forEach(([r,w])=>{cor+=r;att+=r+w});const kn=Object.keys(S.known).length;
 let h='<div class="stats"><div><b>'+kn+'/'+D.length+'</b><span>Cards known</span></div><div><b>'+(att?Math.round(100*cor/att):0)+'%</b><span>Answers right ('+att+')</span></div><div><b>'+Object.keys(S.weak).length+'</b><span>Weak words</span></div><div><b>'+S.best+'</b><span>Best streak</span></div></div><div class="card"><table><tr><th>Theme</th><th>Known</th><th>Accuracy</th></tr>';
 themes.forEach(t=>{const E=D.filter(e=>e.t===t),k=E.filter(e=>S.known[e.n]).length;let r=0,w=0;new Set(E.map(e=>sq(e.w))).forEach(x=>{const s=S.st[x];if(s){r+=s[0];w+=s[1]}});
  h+='<tr><td>'+esc(t)+'</td><td>'+k+'/'+E.length+'<div class="pb"><i style="width:'+100*k/E.length+'%"></i></div></td><td>'+(r+w?Math.round(100*r/(r+w))+'%':'-')+'</td></tr>'});
 return h+'</table></div><button class="'+(rc?'bd':'')+'" data-a="reset">'+(rc?'Tap again to erase all progress':'Reset progress on this device')+'</button>'}
function render(){$('#tabs').innerHTML=tabs.map(([k,l])=>'<button data-a="tab" data-m="'+k+'" class="'+(S.mode===k?'on':'')+'">'+l+'</button>').join('');
 $('#view').innerHTML=S.mode==='flash'?vFlash():S.mode==='prog'?vProg():vQuiz();setScopeVal();const a=$('#ans');if(a)a.focus({preventScroll:true})}
function setScopeVal(){const s=$('#sc');if(s)s.value=S.scope}
function check(){const a=$('#ans');if(!a||Q.done)return;const r=judge(Q.o,a.value,S.mode==='spell'||S.strict);if(!r)return;Q.res=r;Q.done=1;record(Q.o,r.ok);render()}
function finish(t){if(!Q||Q.done)return;Q.res={ok:0,t};Q.done=1;record(Q.o,0);render()}
function act(a,b){switch(a){
 case'tab':S.mode=b.dataset.m;S.pos=S.pos;Q=null;rc=false;save();render();break;
 case'flip':flip=!flip;render();break;
 case'prev':case'fnext':{const n=flashList().length;S.pos=(S.pos+(a==='prev'?-1:1)+n)%n;flip=false;save();render();break}
 case'got':case'learn':{const e=flashList()[S.pos],k=sq(e.w);if(a==='got'){S.known[e.n]=1;delete S.weak[k]}else{delete S.known[e.n];S.weak[k]=1}save();act('fnext');break}
 case'jump':{const v=+$('#jn').value,L=flashList(),i=L.findIndex(e=>e.n>=v);if(i>=0){S.pos=i;flip=false;save();render()}break}
 case'say':say(b.dataset.w);break;case'slow':say(b.dataset.w,1);break;
 case'hint':Q.hint=1;render();break;
 case'check':check();break;case'skip':finish('skip');break;
 case'nextq':newQ();render();break;
 case'reset':if(!rc){rc=true}else{S={mode:'prog',pos:0,known:{},weak:{},st:{},best:0,scope:'all',strict:false,timed:false};sess={r:0,w:0,streak:0,t0:Date.now()};rc=false;save()}render();break}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)act(b.dataset.a,b)});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='sc'){S.scope=t.value;S.pos=0;queue=[];Q=null;flip=false;save();render()}
 else if(t.id==='strict'){S.strict=t.checked;save()}else if(t.id==='timed'){S.timed=t.checked;save();Q=null;render()}});
document.addEventListener('keydown',e=>{const inp=e.target.tagName==='INPUT'||e.target.tagName==='SELECT';
 if(e.key==='Enter'&&e.target.id==='ans'){e.preventDefault();check();return}
 if(e.key==='Enter'&&Q&&Q.done&&!inp&&S.mode!=='flash'&&S.mode!=='prog'){act('nextq');return}
 if(S.mode==='flash'&&!inp){if(e.key==='ArrowRight')act('fnext');else if(e.key==='ArrowLeft')act('prev');else if(e.key===' '&&e.target.tagName!=='BUTTON'){e.preventDefault();act('flip')}}
 else if(e.key==='Enter'&&e.target.classList.contains('fc')){act('flip')}});
setInterval(()=>{const c=$('#clk');if(c){const s=Math.floor((Date.now()-sess.t0)/1000);c.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
 if(Q&&!Q.done&&Q.dl){const l=Q.dl-Date.now(),i=$('#tbi');if(i)i.style.width=Math.max(0,l/200)+'%';if(l<=0)finish('time')}},250);
render();
</script></body></html>
